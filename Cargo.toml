[workspace]
default-members = []
members = [
    "common",
    "controller/firmware",
    "filament-characterisation/characteriser",
    "host",
    "usb-tmc",
]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
version = "0.1.0"

[workspace.dependencies]
clap = { features = ["derive"], version = "4.5.57" }
crossterm = "0.29.0"
env_logger = "0.11.8"
log = "0.4.29"
ratatui = "0.30.0"
serialport = "4.8.1"
thiserror = "2.0.18"
tokio = { features = ["macros", "rt", "sync", "time"], version = "1.49.0" }