[package]
edition = "2024"
name = "scanning-electron-microscope"
publish = false
version = "0.1.0"

[dependencies]
cortex-m-rt = "0.7.5"
embassy-executor = { version = "0.9.1", features = ["arch-cortex-m", "executor-interrupt", "executor-thread"] }
embassy-rp = { version = "0.8.0", features = ["binary-info", "critical-section-impl", "rp235xa", "time-driver"] }
embassy-usb = "0.5.1"
panic-probe = "1.0.0"
static_cell = "2.1.1"
